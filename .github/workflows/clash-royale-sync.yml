name: Clash Royale Sync (Inteligente)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'clan.html'
      - 'index.html'
      - 'member_*.html'
      - 'src/data_clan/**'
      - 'src/data_csv_oficial/**'
      - 'src/data_chests/**'
  schedule:
    # ---------------------------------------------------------------------------------
    # ATENCAO: cron do GitHub Actions roda sempre em UTC, nunca no horario local.
    # BRT = UTC - 3 (ex.: 00:00 BRT = 03:00 UTC). Todo horario abaixo esta em UTC,
    # com o equivalente BRT anotado no comentario para conferencia.
    #
    # Dia (08:00 as 23:59 BRT): alterna 30min / 1h / 30min / 1h.
    # Madrugada (00:00 as 07:59 BRT): a cada 3h, ja que o volume de batalhas cai.
    # ---------------------------------------------------------------------------------

    # --- Madrugada (00:00-07:59 BRT) — a cada 3h ---
    - cron: '0 3 * * *'    # 00:00 BRT
    - cron: '0 6 * * *'    # 03:00 BRT (+3h)
    - cron: '0 9 * * *'    # 06:00 BRT (+3h)

    # --- Dia (08:00-23:59 BRT) — alterna 30min / 1h ---
    - cron: '0 11 * * *'   # 08:00 BRT
    - cron: '30 11 * * *'  # 08:30 BRT (+30m)
    - cron: '30 12 * * *'  # 09:30 BRT (+1h)
    - cron: '0 13 * * *'   # 10:00 BRT (+30m)
    - cron: '0 14 * * *'   # 11:00 BRT (+1h)
    - cron: '30 14 * * *'  # 11:30 BRT (+30m)
    - cron: '30 15 * * *'  # 12:30 BRT (+1h)
    - cron: '0 16 * * *'   # 13:00 BRT (+30m)
    - cron: '0 17 * * *'   # 14:00 BRT (+1h)
    - cron: '30 17 * * *'  # 14:30 BRT (+30m)
    - cron: '30 18 * * *'  # 15:30 BRT (+1h)
    - cron: '0 19 * * *'   # 16:00 BRT (+30m)
    - cron: '0 20 * * *'   # 17:00 BRT (+1h)
    - cron: '30 20 * * *'  # 17:30 BRT (+30m)
    - cron: '30 21 * * *'  # 18:30 BRT (+1h)
    - cron: '0 22 * * *'   # 19:00 BRT (+30m)
    - cron: '0 23 * * *'   # 20:00 BRT (+1h)
    - cron: '30 23 * * *'  # 20:30 BRT (+30m)
    - cron: '30 0 * * *'   # 21:30 BRT (+1h)
    - cron: '0 1 * * *'    # 22:00 BRT (+30m)
    - cron: '0 2 * * *'    # 23:00 BRT (+1h)
    - cron: '30 2 * * *'   # 23:30 BRT (+30m)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install requests python-dotenv

    - name: SINCRONIZACAO COMPLETA (Pipeline Unico)
      env:
        CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}
        CR_PLAYER_TAG: ${{ secrets.CR_PLAYER_TAG }}
        CR_PLAYER_TAG_SEC: ${{ secrets.CR_PLAYER_TAG_SEC }}
        CR_CLAN_TAG: ${{ secrets.CR_CLAN_TAG }}
        CR_CLAN_TAG_SEC: ${{ secrets.CR_CLAN_TAG_SEC }}
      run: |
        cd src
        python main_sync.py

    - name: Commit & Push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        git add data/csv/ README.md docs/ data/json/ data/backups/

        if ! git diff --staged --quiet; then
          HTML_SIZE=$(wc -c < docs/index.html)
          MIN_SIZE=500000
          if [ "$HTML_SIZE" -lt "$MIN_SIZE" ]; then
            echo "AVISO: HTML parece truncado ($HTML_SIZE bytes < $MIN_SIZE). Regenerando..."
            cd src
            python main_sync.py
            cd ..
            git add docs/
          fi

          git commit -m "chore: sincronizacao automatica Clash Royale $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"

          for i in 1 2 3; do
            if git push origin HEAD; then
              echo "[SUCESSO] Sincronizacao enviada ao GitHub com sucesso."
              break
            else
              echo ""
              echo "[AVISO DE CONCORRENCIA] O script local enviou dados primeiro. Tentativa $i/3 falhou."
              echo "[INFO] Puxando alteracoes mais recentes do computador local e unificando na nuvem..."
              sleep 5
              git pull --rebase -X theirs origin main || true
            fi
          done
        else
          echo "Nenhuma alteracao detectada nesta rodada."
        fi